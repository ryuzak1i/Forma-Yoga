<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forma Yoga</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="png" sizes="180x180" href="images/logo-tab.png">

</head>
<body class="walnut">
    <header class="walnut-header">
        <nav class="navbar">
            <ul class="navbar-tabs">
                <!-- Left Group -->
                <li class="nav-left">
                    <a href="index.html#catalogue">Mats</a>
                    <a href="OurStory.html">Our Story</a>
                    <a href="Events.html">Events</a>
                </li>

                <!-- Center Group -->
                <li class="nav-center">
                    <a id="brand-name" href="index.html">Forma</a>
                </li>

                <!-- Right Group -->
                <li class="nav-right">
                    <a href="ToBasket.html">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="product-page-container">
    
        <!-- LEFT SIDE: 2x2 Image Grid -->
        <div class="product-gallery">
            <img src="images/Walnut-Redirect/walnut.png" alt="Walnut Mat">
            <img src="images/Walnut-Redirect/walnut-pose.png" alt="Walnut Mat Pose">
            <img src="images/Walnut-Redirect/qr-mat-walnut.png" alt="Walnut Mat QR">
            <img src="images/Walnut-Redirect/walnut-rolled.png" alt="Walnut Mat Rolled">
        </div>

        <!-- RIGHT SIDE: Product Info Column -->
        <div class="product-details">
            <h1 class="product-title">Forma Walnut Mat</h1>
        
        <div class="price-rating-row">
            <span class="product-price">₱2,500</span>
        </div>

        <hr>

        <!-- Color Selection Block -->
        <div class="color-section">
            <div class="color-swatches">
                <p class="color-label">Color: <b>Walnut</b></p>
                <span class="swatch active" style="background-color: #65463d;"></span>
            </div>
        </div>

        <!-- Action Buttons -->
        <button class="btn-add-bag">ADD TO BAG</button>

        <hr>
    </div>

</main>

    
</body>
</html>
